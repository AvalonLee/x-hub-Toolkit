<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小李工具箱</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand" id="brand" style="cursor:pointer" title="回到首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="12" rx="2.2"/>
          <path d="M8.5 8V6.2A3.2 3.2 0 0 1 11.7 3h0.6a3.2 3.2 0 0 1 3.2 3.2V8"/>
          <path d="M3 13h18"/>
          <rect x="10.4" y="11.4" width="3.2" height="3.2" rx="0.8"/>
        </svg>
        <b>小李工具箱</b>
        <small id="brandver"></small>
      </div>
      <input id="navfilter" class="navfilter" type="text" placeholder="筛选工具…" autocomplete="off">
      <nav id="nav"></nav>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <script src="../assets/catalog.js"></script>
  <script src="../assets/md5.js"></script>
  <!-- vendor（本地，无外发请求）：pdfjs worker 必须先于 pdf.min.js（主线程模式靠 window.pdfjsWorker 注入） -->
  <script src="../assets/vendor/pdf.worker.min.js"></script>
  <script src="../assets/vendor/pdf.min.js"></script>
  <script src="../assets/vendor/pdf-lib.min.js"></script>
  <script src="../assets/vendor/jszip.min.js"></script>
  <script src="../assets/vendor/qrcode.js"></script>
  <script src="../assets/vendor/jsQR.js"></script>
  <script src="../assets/vendor/sm-crypto.min.js"></script>
  <script src="./app.js"></script>
  <script src="./tools/_shared.js"></script>
  <script src="./tools/dev.js"></script>
  <script src="./tools/calc.js"></script>
  <script src="./tools/unit.js"></script>
  <script src="./tools/text.js"></script>
  <script src="./tools/crypto.js"></script>
  <script src="./tools/gm.js"></script>
  <script src="./tools/typing.js"></script>
  <script src="./tools/pdf.js"></script>
  <script src="./tools/convert.js"></script>
  <script src="./tools/color.js"></script>
  <script src="./tools/watermark.js"></script>
  <script src="./tools/img.js"></script>
  <script src="./tools/office.js"></script>
  <script src="./tools/qrcode.js"></script>
</body>
</html>
